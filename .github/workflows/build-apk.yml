name: Crear APK DEXTOR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Plataformas disponibles:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Build tools disponibles:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Crear APK DEXTOR
        run: |
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DEXTOR.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DEXTOR-Android
          path: DEXTOR.apk
          if-no-files-found: error
